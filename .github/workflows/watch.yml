# One run at a time, each about 5 h 40 min. The hourly schedule keeps one run queued, so a new one starts as the
# last ends; GitHub's schedule can lag, and the queue covers it. Each run commits its log, which also keeps the
# schedule alive (GitHub turns off schedules in a repo with no activity for 60 days).
name: watch
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to watch, in minutes
        default: "340"
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Watch the sites
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
        run: ./watch.sh
      - name: Save the log
        if: always()
        run: |
          git config user.name site-watch
          git config user.email site-watch@users.noreply.github.com
          git add log
          git diff --cached --quiet && exit 0
          git commit -qm "log: run ${{ github.run_id }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
